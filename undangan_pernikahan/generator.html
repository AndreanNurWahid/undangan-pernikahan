<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pembuat Link Tamu — Undangan Digital</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f3a30">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="generator-page">
  <main class="container narrow py-5">
    <header class="section-head text-center">
      <p class="script-sub">Fitur Tambahan</p>
      <h1 class="gen-title">Pembuat Link Tamu</h1>
      <p class="lead-text">
        Buat tautan undangan yang dipersonalisasi khusus untuk setiap tamu. Saat tautan dibuka, halaman sampul akan secara otomatis menyapa tamu yang bersangkutan dengan tulisan <em>“Kepada Yth. [Nama Tamu]”</em>.
      </p>
    </header>

    <div class="rsvp-card">
      <div class="mb-3">
        <label for="baseUrl" class="form-label">Alamat undangan</label>
        <input id="baseUrl" type="url" class="form-control" placeholder="https://undangan-anda.vercel.app/">
      </div>
      <div class="mb-3">
        <label for="names" class="form-label">Daftar nama tamu (satu nama per baris)</label>
        <textarea id="names" class="form-control" rows="6"
                  placeholder="Bapak Budi Santoso&#10;Ibu Siti &amp; Keluarga&#10;Dr. Andi Pratama"></textarea>
      </div>
      <div id="genAlert" class="alert alert-danger py-2" role="alert" hidden></div>
      <button id="genBtn" type="button" class="btn btn-gold w-100"><i class="bi bi-link-45deg"></i> Buat Link</button>
    </div>

    <div id="result" class="gen-result"></div>

    <p class="text-center mt-4"><a href="./" class="btn btn-outline-gold btn-sm"><i class="bi bi-arrow-left"></i> Kembali ke undangan</a></p>
  </main>

  <script src="js/generator.js"></script>
</body>
</html>
